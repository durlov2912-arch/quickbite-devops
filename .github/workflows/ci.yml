name: QuickBite CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    name: Build and smoke-test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quickbite:${{ github.sha }} .

      - name: Run container and check health
        run: |
          docker run -d -p 5000:5000 --name quickbite quickbite:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health